[project]
name = "trend-detective-api"
version = "0.1.0"
description = "Trend Detective API: FastAPI-Backend für den Standortvergleich."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
  "pydantic>=2.14.2",
  "pydantic-settings>=2.16.2",
  "httpx>=0.28.1",
  "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "respx>=0.23.1",
  "ruff>=0.17.3",
  "mypy>=2.4.1",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trend_detective"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = ["live: real NASA POWER requests; opt-in with `pytest -m live`"]
